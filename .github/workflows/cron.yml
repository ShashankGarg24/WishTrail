name: Scheduled API Crons

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    # Hourly; eligibility is evaluated in each user's timezone.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  nightly-quotes:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate quotes
        run: curl --fail-with-body --max-time 480 -X POST -H "x-cron-key:$CRON_SECRET" "$API_BASE/cron/nightly-quotes"
        env:
          API_BASE: https://wishtrail-web.onrender.com/api/v1
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  cleanup-delivery-records:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete internal delivery records older than seven days
        run: curl --fail-with-body --max-time 240 -X POST -H "x-cron-key:$CRON_SECRET" "$API_BASE/cron/cleanup-notification-deliveries"
        env:
          API_BASE: https://wishtrail-web.onrender.com/api/v1
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  hourly-notifications:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        endpoint: [morning-quotes, daily-logs-prompts]
    steps:
      - name: Process eligible reminders
        run: curl --fail-with-body --max-time 1080 -X POST -H "x-cron-key:$CRON_SECRET" "$API_BASE/cron/$ENDPOINT"
        env:
          ENDPOINT: ${{ matrix.endpoint }}
          API_BASE: https://wishtrail-web.onrender.com/api/v1
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
